name: Validate Ansible SDD template
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out template
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate adapters, skills, Ansible and acceptance behavior
        run: bash scripts/check.sh

- name: Reject blank banner text
  ansible.builtin.assert:
    that:
      - rhel_motd_text | trim | length > 0
    fail_msg: rhel_motd_text must not be blank

- name: Restrict output to workspace lab-output
  ansible.builtin.assert:
    that:
      - (rhel_motd_path | dirname | realpath) == ((((playbook_dir | dirname) ~ '/lab-output') | realpath))
      - rhel_motd_path | basename not in ['.', '..', '']
      - rhel_motd_mode is match('^0[0-7]{3}$')
    fail_msg: Target must be inside lab-output and mode must be an octal string like 0644

- name: Ensure safe output directory exists when enabled
  ansible.builtin.file:
    path: "{{ rhel_motd_path | dirname }}"
    state: directory
    mode: '0755'
  when: rhel_motd_enabled

- name: Write the environment banner
  ansible.builtin.copy:
    dest: "{{ rhel_motd_path }}"
    content: |
      [{{ rhel_motd_environment | upper }}]
      {{ rhel_motd_text }}
    mode: "{{ rhel_motd_mode }}"
  when: rhel_motd_enabled

- name: Remove the managed banner when disabled
  ansible.builtin.file:
    path: "{{ rhel_motd_path }}"
    state: absent
  when: not rhel_motd_enabled
